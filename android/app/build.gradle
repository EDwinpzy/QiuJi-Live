plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// 复验/联调可临时抬高版本号打一个升级包（-PapkVersionCode / -PapkVersionName），不必改死代码。
def apkVersionCodeOverride = project.findProperty('apkVersionCode')
def apkVersionNameOverride = project.findProperty('apkVersionName')
// Serverless TV release: distribution is manual through GitHub Releases.
// No backend hot update or in-app APK update endpoint is compiled into the APK.
def apiBaseUrl = ''
def apiBaseUrlConstant = '""'
def releaseStorePassword = project.findProperty('OTV_RELEASE_STORE_PASSWORD') ?: System.getenv('OTV_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyPassword = project.findProperty('OTV_RELEASE_KEY_PASSWORD') ?: System.getenv('OTV_RELEASE_KEY_PASSWORD') ?: ''

android {
    namespace 'com.qiubo.optimaltv'
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }

    defaultConfig {
        // v1.19 版本重规划（2026-09-03）：只保留原公测版一条线，命名「TV 版」。
        // 包名沿用公测版 com.qiubo.optimaltv.public——老公测用户直接覆盖升级
        applicationId "com.qiubo.optimaltv.public"
        // 技术方案 §4.2：坚果 N1 Air = Bonfire OS / Android 11 → minSdk 30，零 GMS 依赖
    minSdk 30
    targetSdk 34
    // 2026-09-16：足球比赛列表和信号源解析优化。
    // v1.32（2026-09-16）：云端接口从 Sites 切回腾讯云 CloudBase（国内可直连）。
    // 2026-10-11：所有变体关闭内容准入门禁。
    // v1.34（2026-09-21）：APK 应用内更新支持分片下载——对象桶单对象硬上限 100 MiB，
    // 大包按 < 100 MiB 拆段，客户端按序下载拼成整包后仍校验 SHA-256 与签名证书。
    // v1.36（2026-09-22）：「我的」页新增「检查更新」手动入口（手动检查忽略「稍后更新」记忆）。
    // ---- 版本号规则（2026-09-22 重置）----
    // 用户要求：APK 版本与更新记录清零，从 V1.0 重新开始，之后每版 +0.1。
    //   versionName = V1.0 / V1.1 / V1.2 …（界面展示用）
    //   versionCode = 主版本×100 + 次版本×10 → V1.0=100、V1.1=110、V1.2=120、V2.0=200
    // 必须严格递增：客户端 ApkUpdatePolicy 只比较 versionCode（manifest.versionCode
    // <= 本机 versionCode 即视为无更新），系统安装也不允许降级覆盖。V1.0 取 100 而不是
    // 10，是为了同时高于重置前的 42，已装 1.4x 的设备仍能收到 V1.0 的更新提示。
    versionCode(apkVersionCodeOverride ? Integer.parseInt(apkVersionCodeOverride.toString()) : 336)
    versionName(apkVersionNameOverride ? apkVersionNameOverride.toString() : "3.0.26")
        // 方案 §5：双 ABI split 思路——真机 arm64/v7a + 模拟器 x86_64（开发验证用）
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        // v1.19 版本重规划：内测/公测双 flavor 退役——只保留一条正式分发线（原公测版）。
        // 热更新用于内嵌后端的启动维护。
        // v1.18 热更新：云端下发内嵌后端 zip，启动时静默检查+预下载，下次冷启动生效
        // TV 客户端显示「球迹直播」，归档文件名为 QiuJi-Live-TV.apk。
        resValue 'string', 'app_name', '球迹直播'
        // 足球比赛列表可直接访问，不设置内容准入门禁。
        buildConfigField 'String', 'API_BASE_URL', apiBaseUrlConstant
        buildConfigField 'boolean', 'HOTUPDATE_ENABLED', 'false'
        buildConfigField 'String', 'HOTUPDATE_ENDPOINT', '""'
        buildConfigField 'boolean', 'APK_UPDATE_ENABLED', 'false'
        buildConfigField 'String', 'APK_UPDATE_URL', '""'

        // 焦点导航仪器测试（2026-09-06 三层测试体系第二层）：自定义 Runner 换轻量
        // FocusTestApp（避免仪器测试启动内嵌 Python 后端），harness 见
        // androidTest/.../focus/。真实按键注入（Espresso sendKeySync → Activity
        // .dispatchKeyEvent → OtvNav.dispatch）+ assertIsFocused 语义断言。
        testInstrumentationRunner 'com.qiubo.optimaltv.focus.FocusTestRunner'

    }

    signingConfigs {
        release {
            // 发布签名（2026-08-27 生成，10 年有效期；上架商店若换自有签名须先卸载旧包）
            storeFile file("../optimaltv-release.keystore")
            storePassword releaseStorePassword
            keyAlias "optimaltv"
            keyPassword releaseKeyPassword
            // v1.39（2026-09-22）：补 v1 签名。minSdk 30 时 AGP 默认只出 v2，
            // 但投影仪定制 ROM 的包解析器/安装器常读不了 v2-only 包（表现为
            // 更新包校验反复失败、不停重新下载）；v1+v2 双签是 TV 分发的兼容底线。
            // 签名证书不变（601F…BA43），已装版本可直接覆盖升级。
            enableV1Signing = true
            enableV2Signing = true
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // Chaquopy + 反射（引擎）保守不混淆
            signingConfig signingConfigs.release
        }
        debug {
            // v1.20 QA：debug 也用发布签名，可覆盖安装 release 做升级验证。
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions {
        resources { excludes += ['META-INF/{AL2.0,LGPL2.1}'] }
        // v1.8：libVLC 兜底引擎带入三 ABI so（~140MB 未压缩）——legacy 打包压缩之，
        // 代价仅首次启动多一步解压（TV 盒子一次性）
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// 后端打包进 app：Chaquopy 配置（proxy.py 只用标准库 + 自有模块，无需 pip 包）
chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

// 统一产物到项目目录：apk/TV版/ 固定名 QiuJi-Live-TV.apk，
// 由 assembleRelease 复制（对外分发=签名+热更新正式链路）。
// debug 测试包不进 apk/——直接用项目根 build 构建输出目录。
tasks.register("copyTvApk", Copy) {
    from(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(rootProject.file("../apk/TV版"))
    rename { "QiuJi-Live-TV.apk" }
}
// AGP 的 assemble 任务在 android 插件注册后才出现，须在 afterEvaluate 挂接依赖
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach { finalizedBy("copyTvApk") }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 注：androidx.tv:tv-foundation 已被上游以 Kotlin 2.1 元数据重发布，
    // 与本工程锁定工具链(Kotlin 1.9.24)不兼容；网格用 foundation LazyVerticalGrid，
    // D-pad 滚动行为一致（技术方案 §3.4 的 TvLazyVerticalGrid 等价替代）。

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // 播放引擎层（技术方案 §3.2）：Media3 默认内核；VLC 兜底内核（直播解码失败自动切换）
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'
    // libVLC 兜底引擎（v1.8 2026-08-30）：自带完整 ffmpeg 软解——模拟器/个别盒子的
    // MediaCodec 全系解不动 AVC High(8x8+CABAC) 压段（SoftAVCDec Fatal 0xffffffff），
    // VLC 关闭其 mediacodec 硬解后用自带 avcodec 软解，任何设备都能出画面
    implementation 'org.videolan.android:libvlc-all:3.7.2'

    // 偏好设置：DataStore KV
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 图片：Coil 内存/磁盘双缓存（低内存机限额见 App.kt）
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // 队标 SVG 解码（football-data crests 为 svg，Coil 默认不支持）
    implementation 'io.coil-kt:coil-svg:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 焦点导航几何规则（NavGeom）JVM 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // 焦点导航仪器测试（第二层）：Compose ui-test 的 performKeyInput 经 Espresso
    // sendKeySync 注入真按键，走 Activity.dispatchKeyEvent 全链路（与遥控器同路径）
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // Espresso.pressKey = 窗口级按键注入（instrumentation.sendKeySync → Activity
    // .dispatchKeyEvent → OtvNav）；compose 的 performKeyInput 直注 Compose 层测不了引擎
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
